name: Feature request
description: Propose a user-facing enhancement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Describe the user need rather than only the proposed implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: evidence
    attributes:
      label: Protocol or device evidence
      description: Include sanitized references when the request depends on LUCI behavior.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: This request does not require arbitrary raw-command access.
          required: true

